<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login - RTS Cafe and Resto</title>
    <link rel="stylesheet" href="asset/css/stylesLOGIN.css"> <!-- Menghubungkan ke file CSS -->
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm" onsubmit="submitLogin(); return false;"> <!-- Menggunakan atribut onsubmit -->
            <div class="form-control">
                <label for="username">Username/Email</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-control">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>
        <div class="forgot-password">
            <a href="#">Lupa password?</a>
        </div>
    </div>

    <script src="asset/js/scriptLOGIN.js" defer></script> <!-- Menghubungkan ke file JavaScript -->
</body>
</html>
